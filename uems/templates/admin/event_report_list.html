{% extends "admin/base_site.html" %}

{% block content %}

<style>
    .report-admin-shell {
        max-width: 1100px;
    }

    .report-admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
    }

    .report-admin-btn {
        background: var(--button-bg);
        color: var(--button-fg) !important;
        border-radius: 4px;
        padding: 7px 12px;
        text-decoration: none;
        font-weight: 500;
        display: inline-block;
        white-space: nowrap;
    }

    .report-admin-btn.secondary {
        background: var(--darkened-bg);
        color: var(--body-fg) !important;
        border: 1px solid var(--border-color);
    }

    .report-table-wrap {
        overflow-x: auto;
        border: 1px solid var(--hairline-color);
        border-radius: 4px;
        background: var(--body-bg);
    }

    .report-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 680px;
    }

    .report-table th {
        background: var(--darkened-bg);
        color: var(--body-fg);
        border-bottom: 1px solid var(--hairline-color);
        padding: 11px 12px;
        text-align: left;
        font-weight: 600;
        white-space: nowrap;
    }

    .report-table td {
        border-bottom: 1px solid var(--hairline-color);
        padding: 11px 12px;
        color: var(--body-fg);
        vertical-align: middle;
    }

    .report-table tbody tr:nth-child(even) {
        background: var(--darkened-bg);
    }

    .report-empty {
        text-align: center;
        color: var(--body-quiet-color) !important;
        padding: 24px !important;
    }

    @media (max-width: 640px) {
        .report-admin-header {
            align-items: stretch;
            flex-direction: column;
        }

        .report-admin-btn {
            text-align: center;
        }
    }
</style>

<div class="report-admin-shell">

    <div class="report-admin-header">
        <div></div>
        <a href="{% url 'admin:event_report_module' %}" class="report-admin-btn secondary">Back</a>
    </div>

    <div class="report-table-wrap">
        <table class="report-table">
            <thead>
                <tr>
                    <th>Event Name</th>
                    <th>Date</th>
                    <th>Feedback Count</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for item in rows %}
                <tr>
                    <td style="font-weight:600;">{{ item.event.name }}</td>
                    <td>{{ item.event.date|default:"-" }}</td>
                    <td>{{ item.feedback_count }}</td>
                    <td>
                        <a href="{% url 'admin:events_eventreport_change' item.report.id %}" class="report-admin-btn">
                            View Report
                        </a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="report-empty">No completed events</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</div>

{% endblock %}
