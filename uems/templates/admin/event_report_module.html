{% extends "admin/base_site.html" %}

{% block content %}

<style>
    .report-admin-shell {
        max-width: 1100px;
    }

    .report-module-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
    }

    .report-module-card {
        background: var(--body-bg);
        border: 1px solid var(--hairline-color);
        border-radius: 6px;
        padding: 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
    }

    .report-module-card h3 {
        color: var(--body-fg);
        font-size: 16px;
        margin: 0 0 5px;
    }

    .report-module-card p {
        color: var(--body-quiet-color);
        margin: 0;
        font-size: 13px;
    }

    .report-admin-btn {
        background: var(--button-bg);
        color: var(--button-fg) !important;
        border-radius: 4px;
        padding: 8px 13px;
        text-decoration: none;
        font-weight: 500;
        white-space: nowrap;
    }

    @media (max-width: 640px) {
        .report-module-card {
            align-items: stretch;
            flex-direction: column;
        }

        .report-admin-btn {
            text-align: center;
        }
    }
</style>

<div class="report-admin-shell">

    <div class="report-module-grid">
        <div class="report-module-card">
            <div>
                <h3>Feedback Report</h3>
                <p>Review event feedback counts and feedback analytics.</p>
            </div>
            <a href="{% url 'admin:eventreport_feedback_list' %}" class="report-admin-btn">
                Open
            </a>
        </div>

        <div class="report-module-card">
            <div>
                <h3>Attendance Report</h3>
                <p>Review registrations, attendance totals, and attendance details.</p>
            </div>
            <a href="{% url 'admin:attendance_report_list' %}" class="report-admin-btn">
                Open
            </a>
        </div>
    </div>

</div>

{% endblock %}
